name: Final DevOps CI/CD Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  provision-build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init & Apply
        id: tf
        working-directory: ./students/lytvynov/terraform
        run: |
          terraform init
          terraform apply -auto-approve
          echo "ip=$(terraform output -raw ec2_public_ip)" >> $GITHUB_OUTPUT

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./students/lytvynov
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/final-nodeapp:latest

      - name: Wait for EC2 initialization
        run: sleep 45

      - name: Deploy container via SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s' "${{ secrets.EC2_SSH_KEY_B64 }}" | base64 --decode > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key
          ssh -i ~/.ssh/ec2_key -o StrictHostKeyChecking=no ubuntu@${{ steps.tf.outputs.ip }} << 'EOF'
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/final-nodeapp:latest
            sudo docker rm -f final-app || true
            sudo docker run -d --name final-app --restart always -p 3000:3000 ${{ secrets.DOCKER_USERNAME }}/final-nodeapp:latest
          EOF
